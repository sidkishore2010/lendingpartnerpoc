server.port=8080
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
spring.jackson.default-property-inclusion=non_null
vendor.base-url=${VENDOR_BASE_URL:http://localhost:9090}
vendor.api-key=${VENDOR_API_KEY:dev-api-key-123}
vendor.connect-timeout-ms=${VENDOR_CONNECT_TIMEOUT_MS:3000}
vendor.read-timeout-ms=${VENDOR_READ_TIMEOUT_MS:5000}
quote-api.api-key=${LENDING_API_KEY:dev-lending-api-key-123}
quote-api.failure-rate=${COMMISSION_FAILURE_RATE:0.4}
